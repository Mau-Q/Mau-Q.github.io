        <script>
        (function () {
            // darkreader.min.js（88K）按需加载：浅色模式用户完全不下载
            const drOptions = {
                brightness: 100,
                contrast: 95,
                sepia: 10,
                darkSchemeTextColor: '#e0e0e0',  // 粉笔白文字
                darkSchemeBackgroundColor: '#1e1e1e', // 黑板灰背景
                scrollbarStyle: 'native'
            };

            let loading = null;
            function loadDarkReader() {
                if (window.DarkReader) return Promise.resolve();
                if (!loading) {
                    loading = new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = '/js/darkreader.min.js';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                }
                return loading;
            }

            function enableDark() {
                document.documentElement.style.backgroundColor = '#1e1e1e';
                document.documentElement.style.colorScheme = 'dark';
                return loadDarkReader().then(() => DarkReader.enable(drOptions));
            }

            function disableDark() {
                document.documentElement.style.backgroundColor = '';
                document.documentElement.style.colorScheme = '';
                if (window.DarkReader) DarkReader.disable();
            }

            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const startDark = savedTheme === 'dark' || (!savedTheme && systemDark);
            if (startDark) enableDark();

            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.createElement('button');
                btn.innerText = '🌓';
                btn.type = 'button';
                btn.setAttribute('aria-label', '切换深色模式');
                btn.title = '切换深色模式';
                // 按钮样式：仿照你之前的布局，放在右下角
                btn.style.cssText = `
                    position: fixed; 
                    bottom: 40px; 
                    left: 42px; 
                    z-index: 9999;
                    width: 44px; 
                    height: 44px; 
                    border-radius: 50%; 
                    border: 1px solid #ccc;
                    background: #f7f5ed; 
                    color: #000;
                    font-size: 22px; 
                    cursor: pointer;
                    box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
                    transition: transform 0.2s, background-color 0.3s;
                `;
                let isDark = startDark;
                function paintButton() {
                    btn.style.backgroundColor = isDark ? '#1e1e1e' : '#f7f5ed';
                    btn.style.color = isDark ? '#fff' : '#000';
                }
                paintButton();
                btn.onmouseover = () => btn.style.transform = 'scale(1.1)';
                btn.onmouseout = () => btn.style.transform = 'scale(1)';
                document.body.appendChild(btn);
                // 点击切换逻辑
                btn.addEventListener('click', () => {
                    isDark = !isDark;
                    if (isDark) {
                        enableDark();
                        localStorage.setItem('theme', 'dark');
                    } else {
                        disableDark();
                        localStorage.setItem('theme', 'light');
                    }
                    paintButton();
                });
            });
        })();
        </script>
