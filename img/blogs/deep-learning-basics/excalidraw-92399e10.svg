rm="translate(29 624) rotate(0 173.93359375 16.100000000000023)"><text x="0" y="23.660546874999998" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="28px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">h₁ = ReLU(w₁₁x₁ + w₁₂x₂ + b₁)</text></g><g transform="translate(29 679) rotate(0 150.212890625 16.100000000000023)"><text x="0" y="23.660546874999998" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="28px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ŷ = c₁h₁ + c₂h₂ + c₃h₃ + b₀</text></g><g transform="translate(29 744) rotate(0 275.387939453125 13.225000000000023)"><text x="0" y="19.43544921875" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="23px" fill="#9ba7b8" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">连线表示加权输入；b₁、b₀ 是偏置，未单独画成节点。</text></g><g transform="translate(29 784) rotate(0 252.376708984375 13.225000000000023)"><text x="0" y="19.43544921875" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="23px" fill="#9ba7b8" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">h₂、h₃ 计算方式相同，各自有对应的权重与偏置。</text></g></svg>